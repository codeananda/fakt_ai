[project]
name = "fakt-ai"
version = "0.2.0"
description = "Evidence-graded fact-checking for anything you see online"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Adam Murphy" }, { name = "Stephen Schwaner" }]
dependencies = [
    "fastapi>=0.115",
    "fire>=0.7",
    "httpx>=0.27",
    "loguru>=0.7",
    "pydantic>=2.9",
    "pymupdf>=1.24",
    "tenacity>=9.0",
    "trafilatura>=1.12",
    "typesafe-sdk>=0.7",
    "uvicorn>=0.32",
    "yt-dlp>=2025.1.1",
]

[project.scripts]
fakt = "fakt_ai.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-mock>=3.14", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fakt_ai"]

[tool.ruff]
line-length = 95

[tool.pytest.ini_options]
testpaths = ["tests"]
